services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\OauthService\:
    resource: '../Classes/*'


  WapplerSystems\OauthService\Registry\ClientRegistryInterface:
    alias: WapplerSystems\OauthService\Registry\ClientRegistry
    public: true

  WapplerSystems\OauthService\Registry\ClientRegistry:
    public: true

  WapplerSystems\OauthService\Provider\GenericOAuth2Provider:
    public: true

  # Provider-Interface Tag (alle Provider bekommen diesen Tag)
  _instanceof:
    WapplerSystems\OauthService\Provider\OAuthProviderInterface:
      tags: ['oauth_service.provider']

  # ProviderResolver bekommt alle Provider per tagged iterator
  WapplerSystems\OauthService\Provider\ProviderResolver:
    arguments:
      $providers: !tagged_iterator oauth_service.provider
